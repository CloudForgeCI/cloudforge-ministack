name: Sync cfc-core version

# Keeps this repo's <parent> reference (and, to match, this module's own <version>) on cfc-core's
# latest REAL RELEASE -- never a SNAPSHOT. Tracking cfc-core's in-progress SNAPSHOT instead was
# tried and broken: this repo's own build then depends on cfc-core's current develop tip actually
# existing on Central at the exact moment this runs, which is a race against cfc-core's own
# release/bump cadence in a different repo, not something either side controls. Pinning to the
# latest real release means this repo always builds against something that stays resolvable.
#
# publish-release-branch.yml (in cfc-core) is what forces this repo's <version>/<parent> to match
# an in-progress cfc-core release exactly, but only locally, in that one build -- never by
# committing here. That's the only place a SNAPSHOT-level match actually matters.
#
# Pull-based (this repo polls cfc-core's published Central release metadata).

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [ develop ] # also when a pull request merges, so the version does not wait for the poll
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-cfc-core-version
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to cfc-core's latest real release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Resolved directly from Central's metadata, not versions:update-parent: that plugin only
      # updates to something it considers "newer" than the current value, and by plain version
      # ordering a SNAPSHOT of a higher number (e.g. 3.3.8-SNAPSHOT) sorts newer than a lower real
      # release (3.3.2) -- so once the parent is a SNAPSHOT, that plugin can never move it back
      # down to a real release. Confirmed: this workflow ran clean with no error and changed
      # nothing. A direct string comparison has no such blind spot.
      - name: Resolve cfc-core's latest real release
        id: latest
        run: |
          RELEASE=$(curl -fsSL "https://repo1.maven.org/maven2/com/cloudforgeci/cfc-core/maven-metadata.xml" \
            | grep -o '<release>[^<]*</release>' | sed -E 's|</?release>||g')
          if [ -z "$RELEASE" ]; then
            echo "::error::Could not resolve cfc-core's latest release from Central's maven-metadata.xml"
            exit 1
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: diff
        run: |
          PARENT=$(mvn -q help:evaluate -Dexpression=project.parent.version -DforceStdout)
          RELEASE="${{ steps.latest.outputs.release }}"
          if [ "$PARENT" = "$RELEASE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Parent is already cfc-core $RELEASE; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Parent is $PARENT; cfc-core's latest release is $RELEASE."
            # Range-restricted to between <artifactId>cfc-core</artifactId> and the closing
            # </parent>, so this only ever touches the parent's own <version>, never this
            # module's own <version> tag elsewhere in the file.
            sed -i "/<artifactId>cfc-core<\/artifactId>/,/<\/parent>/ s|<version>[^<]*</version>|<version>${RELEASE}</version>|" pom.xml
            if ! git diff --quiet -- pom.xml; then
              git diff -- pom.xml
            else
              echo "::error::sed did not change pom.xml -- the <parent> pattern did not match."
              exit 1
            fi
          fi

      # This repo's own develop always carries a -SNAPSHOT, same as every other repo's develop --
      # only the parent moves to a real release, never this module's own version.
      - name: Set this module's own version to match the parent, as a SNAPSHOT
        if: steps.diff.outputs.changed == 'true'
        run: mvn -B -q versions:set -DnewVersion="${{ steps.latest.outputs.release }}-SNAPSHOT" -DgenerateBackupPoms=false

      - name: Validate against the updated version
        if: steps.diff.outputs.changed == 'true'
        run: mvn -B -q -o validate || mvn -B -q validate

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          git add pom.xml
          git commit -m "chore(deps): sync to cfc-core version=${NEW_VERSION} [skip ci]"
          git pull --rebase origin develop
          git push origin HEAD:develop
