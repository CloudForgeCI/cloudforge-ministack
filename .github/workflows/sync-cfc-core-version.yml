name: Sync cfc-core version

# Keeps this repo in lockstep with cfc-core's own version (both the <parent> reference and this
# module's own <version>, per the lockstep design in this repo's pom.xml comments): whenever
# cfc-core publishes a new SNAPSHOT or release, this bumps both to match.
#
# Pull-based (this repo polls cfc-core's published Central snapshots metadata) -- mirrors
# cfc-core's own sync-cloudforge-manager-deployment-version.yml.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-cfc-core-version
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to cfc-core's latest published version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Update the <parent> version to cfc-core's latest SNAPSHOT
        run: >
          mvn -B -q versions:update-parent
          -DallowSnapshots=true
          -DgenerateBackupPoms=false
          "-Dmaven.version.ignore=^[0-9]+\.[0-9]+\.[0-9]+$"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- pom.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream version change detected; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- pom.xml
          fi

      - name: Set this module's own version to match the parent
        if: steps.diff.outputs.changed == 'true'
        run: |
          NEW_VERSION=$(mvn -q help:evaluate -Dexpression=project.parent.version -DforceStdout)
          mvn -B -q versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false

      - name: Validate against the updated version
        if: steps.diff.outputs.changed == 'true'
        run: mvn -B -q -o validate || mvn -B -q validate

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          git add pom.xml
          git commit -m "chore(deps): sync to cfc-core version=${NEW_VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
