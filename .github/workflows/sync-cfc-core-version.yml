name: Sync cfc-core version

# Keeps this repo's <parent> reference (and, to match, this module's own <version>) on cfc-core's
# latest published SNAPSHOT. This repo's build has no circular dependency back on cfc-core's own
# reactor to worry about -- that coupling (cloudforge-api depending on this module) was removed
# entirely -- so there's no reason not to track cfc-core's develop tip continuously, same as
# before. publish-release-branch.yml (in cfc-core) is what forces this repo's <version>/<parent>
# to match an in-progress cfc-core release exactly, but only locally, in that one build; never by
# committing here.
#
# Pull-based (this repo polls cfc-core's published Central snapshots metadata).

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [ develop ] # also when a pull request merges, so the version does not wait for the poll
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # to dispatch publish-snapshot.yml below

concurrency:
  group: sync-cfc-core-version
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to cfc-core's latest published SNAPSHOT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Resolved directly from Central's snapshot metadata, not versions:update-parent: that
      # plugin's own version-ordering comparison has a confirmed blind spot elsewhere in this
      # project (see cfc-core's own sync-cloudforge-ministack-version.yml history) -- a direct
      # string comparison against the metadata's own <latest> entry has no such risk.
      - name: Resolve cfc-core's latest published SNAPSHOT
        id: latest
        run: |
          LATEST=$(curl -fsSL "https://central.sonatype.com/repository/maven-snapshots/com/cloudforgeci/cfc-core/maven-metadata.xml" \
            | grep -o '<version>[^<]*-SNAPSHOT</version>' | sed -E 's|</?version>||g' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::Could not resolve cfc-core's latest SNAPSHOT from Central's snapshot metadata"
            exit 1
          fi
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: diff
        run: |
          PARENT=$(mvn -q help:evaluate -Dexpression=project.parent.version -DforceStdout)
          LATEST="${{ steps.latest.outputs.latest }}"
          if [ "$PARENT" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Parent is already cfc-core $LATEST; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Parent is $PARENT; cfc-core's latest SNAPSHOT is $LATEST."
            # Range-restricted to between <artifactId>cfc-core</artifactId> and the closing
            # </parent>, so this only ever touches the parent's own <version>, never this
            # module's own <version> tag elsewhere in the file.
            sed -i "/<artifactId>cfc-core<\/artifactId>/,/<\/parent>/ s|<version>[^<]*</version>|<version>${LATEST}</version>|" pom.xml
            if ! git diff --quiet -- pom.xml; then
              git diff -- pom.xml
            else
              echo "::error::sed did not change pom.xml -- the <parent> pattern did not match."
              exit 1
            fi
          fi

      - name: Set this module's own version to match the parent
        if: steps.diff.outputs.changed == 'true'
        run: mvn -B -q versions:set -DnewVersion="${{ steps.latest.outputs.latest }}" -DgenerateBackupPoms=false

      - name: Validate against the updated version
        if: steps.diff.outputs.changed == 'true'
        run: mvn -B -q -o validate || mvn -B -q validate

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          git add pom.xml
          git commit -m "chore(deps): sync to cfc-core version=${NEW_VERSION} [skip ci]"
          git pull --rebase origin develop
          git push origin HEAD:develop

      # [skip ci] on the commit above means no workflow fires for it at all, on top of
      # GITHUB_TOKEN pushes never triggering other workflows' `push` trigger regardless --
      # confirmed live: a version bump landed on develop once but nothing ever actually published
      # it, so cfc-core's own builds kept failing to resolve a SNAPSHOT that was pinned but never
      # real. Dispatching explicitly is what actually publishes it.
      - name: Trigger publish-snapshot.yml for the bumped version
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-snapshot.yml --ref develop
