name: Publish to Maven Central

# Builds, tests, and publishes this module. Version is never bumped here; sync-cfc-core-version.yml
# keeps it in lockstep with cfc-core's own version.
#
#   pull request   publishes the -SNAPSHOT version, so cfc-core and the other repos can build against
#                  the change under review (as cfc-core's own pull requests do). Pull requests from
#                  forks do not publish: they have no access to the secrets.
#   push to main   publishes the release version. When the pom still carries a -SNAPSHOT version
#                  nothing is published, because a release needs a released cfc-core parent, which
#                  sync-cfc-core-version.yml adopts once cfc-core publishes one.
#
# Required repo secrets (same four cfc-core's own publish workflows use):
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE, CENTRAL_PORTAL_USERNAME, CENTRAL_PORTAL_PASSWORD

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # -DskipTests=false: the cfc-core parent pom defaults skipTests to true, and its published form
      # has no -Pci profile to turn them back on, so without it this step builds without running them.
      # The tests that need a running MiniStack are tagged ministack, which the pom excludes; fleet.yml covers them.
      - name: Build and test
        run: mvn -B -DskipTests=false clean verify

  mode:
    name: Decide what to publish
    runs-on: ubuntu-latest
    needs: build-test
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Match the version to the trigger
        id: decide
        run: |
          VERSION=$(mvn -q -pl . help:evaluate -Dexpression=project.version -DforceStdout)
          publish=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "Pull request from a fork: no secrets, nothing published."
            elif [[ "$VERSION" == *-SNAPSHOT ]]; then
              publish=true
            else
              echo "::error::Version '$VERSION' is not a SNAPSHOT; pull requests publish snapshots only."
              exit 1
            fi
          elif [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Version '$VERSION' is a SNAPSHOT: nothing to release from this push."
          else
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  publish:
    name: Sign and publish to Central
    needs: [ build-test, mode ]
    if: ${{ needs.mode.outputs.publish == 'true' }}
    # macOS, not Linux: on GitHub's Linux runners gpg-agent fails with "Too much data for IPC
    # layer" when signing -- same issue cfc-core's own publish workflows document. macOS runners
    # are not affected.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install gnupg
        run: brew install gnupg

      - name: Read project version
        id: version
        run: |
          VERSION=$(mvn -q -pl . help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $VERSION"

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY_B64: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          DECODED=$(echo "$GPG_PRIVATE_KEY_B64" | base64 -d)
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done <<< "$DECODED"
          echo "$DECODED" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_HOMEDIR=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Configure Maven settings.xml (Central Portal credentials)
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
        run: |
          if [ -z "$CENTRAL_PORTAL_USERNAME" ] || [ -z "$CENTRAL_PORTAL_PASSWORD" ]; then
            echo "::error::CENTRAL_PORTAL_USERNAME/CENTRAL_PORTAL_PASSWORD secrets are not set."
            exit 1
          fi
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_PORTAL_USERNAME}</username>
                <password>${CENTRAL_PORTAL_PASSWORD}</password>
                <!-- Maven sends a server's credentials only to the origins of the repositories declared
                     with the same id, and "central" is Maven Central. List the Central Portal origin so
                     the credentials go to the snapshots repository and not to Maven Central. -->
                <repositoryOrigins>
                  <repositoryOrigin>https://central.sonatype.com</repositoryOrigin>
                </repositoryOrigins>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build, sign, and publish
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease clean deploy -DskipTests "-Dgpg.passphrase=$MAVEN_GPG_PASSPHRASE"

      - name: Clean up credentials
        if: always()
        run: |
          rm -f ~/.m2/settings.xml
          rm -rf "${GNUPGHOME:-$RUNNER_TEMP/gnupg}"

      - name: Publish summary
        if: always()
        run: |
          echo "## Maven Central Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
